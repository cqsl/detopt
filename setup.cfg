[metadata]
name = sld
version = 1.0.0

[options]
packages = find:
python_requires = >=3.12
install_requires =
    jax>=0.11
    jaxlib
    numpy
    scipy
    h5py
    pyscf
    tqdm
    flax
    molsym @ git+https://github.com/NASymmetry/MolSym.git@178e0290faadc9bc2b32247b74ca9da041d760db
    qcelemental>=0.50

[options.entry_points]
console_scripts =
    sld-optimize = sld.scripts.optimize:main
    sld-optimize-partial = sld.scripts.optimize_partial:main
    sld-optimize-partial-distributed = sld.scripts.optimize_partial_distributed:main
    sld-postprocess = sld.scripts.postprocess:main
    sld-postprocess-symm = sld.scripts.postprocess_symm:main
    sld-show-symm = sld.scripts.show_symm:main
