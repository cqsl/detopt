[metadata]
name = sld
version = 1.0.0

[options]
packages = find:
python_requires = >=3.12
install_requires =
    jax>=0.11
    jaxlib
    numpy
    scipy
    h5py
    pyscf
    tqdm
    flax

[options.entry_points]
console_scripts =
    sld-optimize = sld.scripts.optimize:main
    sld-optimize-partial = sld.scripts.optimize_partial:main
    sld-optimize-partial-distributed = sld.scripts.optimize_partial_distributed:main
    sld-postprocess = sld.scripts.postprocess:main
